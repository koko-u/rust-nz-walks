[workspace]
members = ["api"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["KOZAKI Tsuneaki <kozaki.tsuneaki@gmail.com>"]
license = "MIT"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
color-eyre = { version = "0.6.5", features = [] }
derive_more = { version = "2.1.1", features = ["full"] }
eyre = { version = "0.6.14", features = ["auto-install"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = [
    "preserve_order",
    "arbitrary_precision",
] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "macros",
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "uuid",
    "time",
    "rust_decimal",
] }
time = { version = "0.3.55", features = [
    "formatting",
    "local-offset",
    "macros",
    "parsing",
    "serde",
    "serde-well-known",
    "serde-human-readable",
] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "json",
    "local-time",
    "matchers",
    "time",
    "tracing",
    "tracing-serde",
    "tracing-log",
] }
uom = { version = "0.38.0", features = [
    "i32",
    "i64",
    "serde",
    "try-from",
] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.25.0", features = [
    "serde",
    "fast-rng",
    "v4",
    "v7",
] }

axum = { version = "0.8.9", features = ["macros"] }
garde = { version = "0.23.0", features = [
    "derive",
    "email",
    "pattern",
    "rust_decimal",
    "serde",
    "unicode",
    "url",
] }
hyper = { version = "1.11.0", features = ["full"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["full"] }
tower = { version = "0.5.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["full"] }
utoipa = { version = "5.5.0", features = [
    "config",
    "decimal",
    "preserve_path_order",
    "preserve_order",
    "time",
    "url",
    "uuid",
] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
